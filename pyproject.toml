[project]
name = "pgchat"
version = "0.1.0"
description = "MCP-powered natural language database operator for Postgres"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Priyanka Gupta" }
]
dependencies = [
  "asyncpg>=0.31.0",
  "google-genai>=2.4.0",
  "mcp[cli]>=1.27.0",
  "pydantic>=2.13.0",
  "rich>=15.0.0",
  "typer>=0.25.0",
]

[project.scripts]
pgchat = "pgchat.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
]
