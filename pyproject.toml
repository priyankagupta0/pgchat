[project]
requires-python = ">=3.11"
name = "pgchat"
version = "0.1.0"
readme = "README.md"
description = "MCP-powered natural language PostgreSQL operator"
dependencies = [
    "typer>=0.12.0",
    "mcp[cli]>=1.27.0",
    "asyncpg>=0.29.0",
    "rich>=13.7.0",
    "google-genai>=0.4.0",
    "pydantic>=2.0.0",
    "toml>=0.10.2",
]

[project.scripts]   
pgchat = "pgchat.cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pgchat*"]
